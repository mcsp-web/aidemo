services:
  askdoc:
    image: ghcr.io/mcsp-web/aidemo:latest
    pull_policy: always
    expose:
      - "8000"
    environment:
      # Coolify generates the public domain from this and routes to port 8000.
      - SERVICE_FQDN_ASKDOC_8000=/
      - APP_PORT=8000
      # Your existing Anthropic key. Set it in a .env file next to this one.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Provider + model are swappable without touching code.
      - LLM_PROVIDER=anthropic
      - LLM_MODEL=claude-haiku-4-5-20251001
      # To use OpenAI instead, comment the two lines above and use:
      # - LLM_PROVIDER=openai
      # - LLM_MODEL=gpt-4o-mini
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
