name: build-lite

# AskDoc Lite image. Separate from build-image.yml (the RAG image) so a Lite-only
# change never rebuilds torch, and the RAG image never ships Lite-only files.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements-lite.txt"
      - "Dockerfile.lite"
      - "test_lite.py"
      - "docker-compose.lite.yml"
      - ".github/workflows/build-lite.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-lite-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Lite deps + test-only deps
        run: pip install -r requirements-lite.txt reportlab httpx
      - run: python test_lite.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mcsp-web/aidemo-lite
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.lite
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/mcsp-web/aidemo-lite:buildcache
          cache-to: type=registry,ref=ghcr.io/mcsp-web/aidemo-lite:buildcache,mode=max
